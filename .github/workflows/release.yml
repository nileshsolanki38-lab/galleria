name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: ./Scripts/build.sh

      - name: Create DMG
        run: |
          STAGE=$(mktemp -d)
          cp -R dist/Galleria.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          rm -f dist/Galleria.dmg
          hdiutil create -volname "Galleria" -srcfolder "$STAGE" -ov -format UDZO dist/Galleria.dmg
          shasum -a 256 dist/Galleria.dmg > dist/Galleria.dmg.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Galleria.dmg
            dist/Galleria.dmg.sha256
          generate_release_notes: true
