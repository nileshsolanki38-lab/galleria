name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: ./Scripts/build.sh

      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent Galleria.app Galleria-macos.zip
          shasum -a 256 Galleria-macos.zip > Galleria-macos.zip.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Galleria-macos.zip
            dist/Galleria-macos.zip.sha256
          generate_release_notes: true
